# amp-bb, served beside AMP's panel on the same origin.
#
# This is a template. install.sh writes the real file into
# /etc/nginx/amp-bb.d/ with @SOCKET@ replaced, because the socket is named
# after the instance.
#
# Include this from inside the server{} block of the panel's vhost -- on a
# CubeCoders install that is /etc/nginx/conf.d/<panel host>.conf, which AMP
# generates and may rewrite. Adding one include line there keeps the loss to
# one line if it ever does; everything else lives in this file, which is ours.
#
#     include /etc/nginx/amp-bb.d/*.conf;
#
# Same origin as the panel is the point: it is what lets the tab use a cookie,
# skip CORS entirely, and read the panel's own session out of the page it is
# running in.

# Everything the daemon serves.
location ^~ /amp-bb/ {
    proxy_pass http://unix:@SOCKET@;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The event stream: no buffering, no early timeout. The daemon also sends
    # X-Accel-Buffering: no. Without these a working daemon looks dead.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# The plugin's own files. AMP's loader fetches these from a path it decides,
# so this location is fixed rather than chosen.
location ^~ /Plugins/AmpBB/ {
    proxy_pass http://unix:@SOCKET@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
